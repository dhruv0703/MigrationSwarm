services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-migrationswarm}
      POSTGRES_USER: ${POSTGRES_USER:-migrationswarm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-migrationswarm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - migrationswarm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - migrationswarm-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  migrationswarm-postgres-data:
  migrationswarm-redis-data:
